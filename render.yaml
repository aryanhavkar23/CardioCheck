services:
  # ==============================================================================
  # 1. CardioCheck FastAPI Backend Web Service
  # ==============================================================================
  - type: web
    name: cardiocheck-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: MODEL_DIR
        value: Models
      - key: LOGISTIC_REGRESSION_MODEL_PATH
        value: Models/logistic_regression_model.pkl
      - key: SCALER_PATH
        value: Models/heart_disease_scaler.pkl
      - key: CORS_ORIGINS
        value: '["https://cardiocheck-frontend.onrender.com"]'
      - key: DATABASE_URL
        fromDatabase:
          name: cardiocheck-db
          property: connectionString

  # ==============================================================================
  # 2. CardioCheck Stitch Medical Frontend (Static Site)
  # ==============================================================================
  - type: web
    name: cardiocheck-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cardiocheck-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ==============================================================================
# 3. Persistent Managed PostgreSQL Database
# ==============================================================================
databases:
  - name: cardiocheck-db
    databaseName: cardiocheck
    user: cardiocheck_admin
    region: oregon
    plan: free
